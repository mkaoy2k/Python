<html>
    <body>
        <h1>大蟒蛇日誌</h1>
        <h3 id="currentDate"></h3>
        <script>
            // 創建日期物件
            const today = new Date();
            // 格式化日期（年、月、日）
            const year = today.getFullYear();
            const month = today.getMonth() + 1; // getMonth() 返回 0-11，所以要加1
            const day = today.getDate();
            
            // 將日期轉換為繁體中文格式
            const chineseDate = `${year}年${month}月${day}日`;
            // 將日期顯示在 HTML 中
            document.getElementById('currentDate').textContent = chineseDate;
            </script>
           
            <!-- Include contents in a 2x1 table -->
            <table style="width: 100%; border-collapse: collapse; table-layout: fixed;">
                <tr>
                    <td style="padding: 10px 0; vertical-align: top;">
                        <h2>今天笑了沒？</h2>
                        <p>
                            昨天中午，有個男同事外出，沒把手機帶走。
                            他老婆不停地打電話來，午睡的女同事被吵煩了，
                            拿過手機大吼：「我們在睡覺，你煩不煩！」
                            結果，那位男同事今天到現在都沒來上班！
                        </p>
                    </td>
                </tr>
                <tr>
                    <td style="padding: 10px 0; vertical-align: top;">
                        <h2>今日格言</h2>
                        <p>
                            三分醉的女人，會打開話匣子。
                            七分醉的男人，會打開皮夾子。
                        </p>
                    </td>
                </tr>
            </table>

    </body>
